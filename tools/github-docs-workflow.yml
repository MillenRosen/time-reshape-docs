name: Documentation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            source/requirements.txt
            source/requirements-pdf.txt
      - run: sudo apt-get update && sudo apt-get install -y fontconfig fonts-noto-cjk libpango-1.0-0 libpangoft2-1.0-0
      - run: python -m pip install -r source/requirements.txt -r source/requirements-pdf.txt
      - run: make check
      - uses: actions/upload-artifact@v4
        with:
          name: time-reshape-user-guide
          path: build/html
